<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/graph.css" />
    <link rel="stylesheet" href="css/markdown.css" />
    <link rel="stylesheet" href="css/admin.css?v=20261025-auth-center" />
    <link rel="stylesheet" href="css/city.css" />

<body>
    <div id="app">
        <main class="boot-screen" aria-label="Загрузка игры">
            <div class="boot-brand"><span class="brand-logo"><svg class="brand-symbol" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="16" class="brand-tile" /><path d="M7 32 H19" class="brand-wire exec" /><path d="M45 32 H57" class="brand-wire data" /><rect x="21.5" y="21.5" width="21" height="21" rx="3.5" transform="rotate(45 32 32)" class="brand-chip" /><circle cx="32" cy="32" r="4.4" class="brand-core" /><circle cx="7" cy="32" r="2.6" class="brand-spark" /></svg><span class="brand-word"><b>СИНАПС</b><small>ГОРОД БЛОКОВ</small></span></span></div>
            <div class="boot-copy">
                <small>СИНАПС / ПОДКЛЮЧЕНИЕ</small>
                <h1>Готовим рабочее поле</h1>
                <p>Загружаем блоки и ваши сохранённые уровни…</p>
                <div class="boot-line"><i></i></div>
            </div>
        </main>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка интерфейса.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">×</span>
    </div>
    <!-- Небольшой нативный помощник даёт плавно двигать большое нодовое поле мышью. -->
    <script src="js/canvas-pan.js"></script>
    <script src="js/admin-ui.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
